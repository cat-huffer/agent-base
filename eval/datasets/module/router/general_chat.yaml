# Router Module Eval：非业务数据请求应交给 General。

id: router_general_chat
version: 1.0.0
name: "普通聊天请求路由到 General"
description: >
  用户询问普通知识问题，不需要访问业务数据库，应交给 General。
  此用例与业务数据查询正例配对，检查 Router 不会把所有请求都交给 NL2SQL。

level: module
capability: routing
tags: [router, regression, general, no_data_query]
difficulty: easy
source:
  type: synthetic
  note: "用于覆盖普通对话负例。"

input:
  message: "为什么海水看起来是蓝色的？"
  session: fresh

expected:
  handoff_target: General
  handoff_count: 1

graders:
  - id: expected_handoff_target
    provider: local
    target: trial.handoff_target
    config:
      equals_expected: expected.handoff_target
    pass_threshold: 1.0
    required: true
  - id: exactly_one_router_handoff
    provider: local
    target: trial.handoff_count
    config:
      equals_expected: expected.handoff_count
    pass_threshold: 1.0
    required: true
