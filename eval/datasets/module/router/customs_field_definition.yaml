# 路由边界：询问业务字段含义，不是读取业务记录。

id: router_customs_field_definition
version: 1.0.0
name: "解释关务字段含义时路由到 General"
description: >
  用户询问关务表中“放行状态”字段的一般含义，没有要求查询具体数据，
  应交给 General。此用例检查 Router 不会仅因出现表名和字段名就触发 NL2SQL。

level: module
capability: routing
tags: [router, regression, general, field_definition, boundary]
difficulty: medium
source:
  type: synthetic
  note: "用于区分业务术语解释与业务记录查询。"

input:
  message: "关务表中的‘放行状态’一般表示什么？"
  session: fresh

expected:
  handoff_target: General
  handoff_count: 1

graders:
  - id: expected_handoff_target
    provider: local
    target: trial.handoff_target
    config:
      equals_expected: expected.handoff_target
    pass_threshold: 1.0
    required: true
  - id: exactly_one_router_handoff
    provider: local
    target: trial.handoff_count
    config:
      equals_expected: expected.handoff_count
    pass_threshold: 1.0
    required: true
